name: pygbag_build
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with Pygbag
        run: |
          python -m pip install --upgrade pip pygbag
          python -m pygbag --build hallowtale

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: hallowtale/build/web
